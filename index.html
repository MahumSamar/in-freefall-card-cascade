<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Freefall — Gallery Vol. 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #eeeeec;
    --ink: #131316;
    --muted: #5d5d61;
    --faint: #9a9a9e;
    --blue: #2a1bff;
    --count: 11;
    --step: 60vh;            /* scroll distance per card */
    --wide: "Archivo", "Arial Black", system-ui, sans-serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  html, body { margin: 0; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- Scroll track + pinned stage ---------- */
  .freefall {
    position: relative;
    height: calc(100vh + (var(--count) - 1) * var(--step));
  }
  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(42% 26% at 49% 10%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
      radial-gradient(120% 90% at 50% 40%, #f1f1ef 0%, #ededeb 60%, #e6e6e4 100%);
  }

  /* ---------- Left copy ---------- */
  .copy {
    position: absolute;
    left: 62px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    max-width: 440px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 30px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .eyebrow::before {
    content: "";
    width: 34px;
    height: 1px;
    background: #b9b9bc;
  }
  .title {
    margin: 0;
    font-family: var(--wide);
    font-stretch: 125%;
    font-size: 92px;
    line-height: .99;
    letter-spacing: -.035em;
    font-weight: 900;
  }
  .title span { display: block; width: max-content; transform: scaleX(1.32); transform-origin: 0 50%; }
  .title em {
    display: inline-block;
    padding-right: .12em;       /* keep the italic overhang inside the gradient box */
    margin-left: .02em;
    transform: scaleX(1.1);
    transform-origin: 0 50%;
    font-style: italic;
    font-weight: 600;
    letter-spacing: -.045em;
    background: linear-gradient(90deg, #3a1bff 0%, #7412cf 34%, #c0127e 68%, #f2472d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lede {
    margin: 42px 0 0;
    max-width: 292px;
    font-size: 15px;
    line-height: 22px;
    color: var(--muted);
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    height: 43px;
    margin-top: 33px;
    padding: 0 19px 0 21px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-family: var(--wide);
    font-stretch: 112%;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -.005em;
    cursor: pointer;
    box-shadow: 0 14px 26px -12px rgba(19,19,22,.55), 0 3px 8px rgba(19,19,22,.16);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s cubic-bezier(.2,.8,.2,1);
  }
  .cta i {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .35s;
  }
  .cta svg { width: 10px; height: 10px; }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 20px 32px -14px rgba(19,19,22,.6), 0 4px 10px rgba(19,19,22,.18); }
  .cta:hover i { transform: translateX(3px); background: rgba(255,255,255,.26); }
  .cta:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  /* ---------- Deck ---------- */
  .deck {
    position: absolute;
    inset: 0;
    z-index: 2;
    perspective: 1300px;
    perspective-origin: 68.4% 46%;
    pointer-events: none;
    --cw: 320px;
  }
  .card {
    position: absolute;
    left: 68.4%;
    top: 0;
    width: var(--cw);
    height: calc(var(--cw) * 1.0625);
    margin: calc(var(--cw) * -.53125) 0 0 calc(var(--cw) * -.5);
    border-radius: calc(var(--cw) * .085);
    overflow: hidden;
    background: #1a1a1e;
    font-size: calc(var(--cw) / 20);          /* 16px at 320 — inner type scales with the card */
    color: #fff;
    box-shadow:
      0 2.2em 3.4em -1.5em rgba(22,22,40,.42),
      0 .7em 1.3em -.6em rgba(0,0,0,.28);
    will-change: transform, opacity;
    backface-visibility: hidden;
    transform-origin: 50% 50%;
  }
  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.2) 0%, rgba(0,0,0,0) 22%),
      linear-gradient(180deg, rgba(8,8,12,0) 46%, rgba(8,8,12,.62) 82%, rgba(8,8,12,.82) 100%);
  }
  .card > * { z-index: 1; }
  .card .idx {
    position: absolute;
    top: 1.5em;
    left: 1.6em;
    padding: .28em .78em;
    border: 1px solid rgba(255,255,255,.34);
    border-radius: .5em;
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font-family: var(--mono);
    font-size: .62em;
    font-weight: 700;
    letter-spacing: .12em;
    white-space: nowrap;
  }
  .card .tag {
    position: absolute;
    top: 1.95em;
    right: 1.9em;
    font-family: var(--mono);
    font-size: .53em;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    opacity: .82;
  }
  .card .meta {
    position: absolute;
    left: 1.9em;
    right: 1.9em;
    bottom: 1.5em;
  }
  .card .chapter {
    display: block;
    font-family: var(--mono);
    font-size: .5em;
    font-weight: 500;
    letter-spacing: .26em;
    text-transform: uppercase;
    opacity: .78;
  }
  .card h3 {
    margin: .14em 0 .3em;
    font-family: var(--wide);
    font-stretch: 120%;
    font-size: 1.82em;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .card p {
    margin: 0;
    max-width: 19em;
    font-size: .66em;
    line-height: 1.38;
    letter-spacing: .01em;
    color: rgba(255,255,255,.74);
  }

  /* ---------- Progress rail ---------- */
  .rail {
    position: absolute;
    right: 78px;
    top: 51%;
    transform: translate(50%, -50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    --h: min(366px, 42.8vh);
  }
  .rail .num {
    position: relative;
    margin-bottom: 14px;
    font-family: var(--wide);
    font-stretch: 125%;
    font-size: 34px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .rail .num small {
    position: absolute;
    left: 100%;
    bottom: 3px;
    margin-left: 5px;
    font-family: var(--wide);
    font-stretch: 100%;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0;
    color: #77777b;
  }
  .rail .line {
    position: relative;
    width: 1px;
    height: var(--h);
    background: #c4c4c7;
  }
  .rail .tick {
    position: absolute;
    left: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: #b5b5b9;
  }
  .rail .fill {
    position: absolute;
    left: -.5px;
    top: 0;
    width: 2px;
    height: 100%;
    background: var(--blue);
    transform-origin: 50% 0;
    transform: scaleY(0);
    will-change: transform;
  }
  .rail .dot {
    position: absolute;
    left: 50%;
    top: 0;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 4px rgba(42,27,255,.14), 0 0 14px 2px rgba(42,27,255,.6);
    will-change: transform;
  }
  .rail .name {
    margin-top: 15px;
    writing-mode: vertical-rl;
    font-family: var(--wide);
    font-stretch: 112%;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
    height: 80px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .copy { left: 44px; }
    .title { font-size: 76px; }
    .rail { right: 54px; }
    .deck { perspective-origin: 66% 46%; }
    .card { left: 66%; }
  }
  @media (max-width: 900px) {
    .copy { left: 32px; max-width: 320px; }
    .title { font-size: 58px; }
    .lede { margin-top: 28px; font-size: 14px; line-height: 21px; max-width: 250px; }
    .cta { margin-top: 26px; }
    .rail { right: 38px; }
    .rail .num { font-size: 26px; }
  }
  @media (max-width: 700px) {
    :root { --step: 52vh; }
    .copy {
      left: 22px;
      right: 22px;
      top: 26px;
      transform: none;
      max-width: none;
    }
    .eyebrow { margin-bottom: 14px; font-size: 9px; }
    .eyebrow::before { width: 24px; }
    .title { font-size: clamp(38px, 12.4vw, 56px); }
    .lede { margin-top: 14px; font-size: 13px; line-height: 19px; max-width: 270px; }
    .cta { margin-top: 16px; height: 38px; font-size: 12px; padding: 0 15px 0 17px; }
    .deck {
      top: 37%;
      perspective: 1000px;
      perspective-origin: 42% 46%;
    }
    .card { left: 42%; }
    .rail {
      right: 36px;
      top: 68.5%;
      --h: min(240px, 30vh);
    }
    .rail .num { font-size: 20px; margin-bottom: 10px; }
    .rail .num small { font-size: 8px; bottom: 2px; margin-left: 3px; }
    .rail .name { font-size: 8px; margin-top: 11px; height: 62px; }
  }
  @media (max-width: 700px) and (max-height: 640px) {
    .lede { display: none; }
    .deck { top: 30%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta, .cta i { transition: none; }
  }
</style>
</head>
<body>

<section class="freefall" id="freefall" aria-label="In Freefall gallery">
  <div class="stage">

    <div class="copy">
      <p class="eyebrow">Gallery · Vol. 01</p>
      <h1 class="title"><span>In</span><em>Freefall</em></h1>
      <p class="lede">Eleven abstractions caught mid-drop. Scroll, and each one folds over the crest and cascades straight down into the pit.</p>
      <button class="cta" type="button" id="explore">
        Explore the deck
        <i aria-hidden="true"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5h7M5.6 2.1 8.5 5 5.6 7.9"/></svg></i>
      </button>
    </div>

    <div class="deck" id="deck"></div>

    <div class="rail" aria-hidden="true">
      <div class="num"><span id="num">01</span><small>/11</small></div>
      <div class="line" id="line">
        <span class="fill" id="fill"></span>
        <span class="dot" id="dot"></span>
      </div>
      <div class="name" id="name">Plume</div>
    </div>

  </div>
</section>

<script>
(function () {
  var CDN = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/";
  var CARDS = [
    { name: "Plume",    tag: "Motion", text: "Long-exposure light drawn upward into colour.",      img: "hf_20261010_122616_5a46a5bd-f792-44f5-a0c9-c7b0fa4b91c0.png" },
    { name: "Chapel",   tag: "Glass",  text: "Translucent panes overlapping like cathedral light.", img: "hf_20261010_122558_84d884d7-ff8c-489f-9fb0-e58e2e35548e.png" },
    { name: "Lantern",  tag: "Glow",   text: "Ribbons of light suspended in the dark.",             img: "hf_20261010_122559_cbfa4857-8668-4a9b-aa89-42546d5b2771.png" },
    { name: "Frond",    tag: "Radial", text: "A fan of blades opening from a single point.",        img: "hf_20261010_122617_20050654-fbc1-46b7-ac76-ef9cbc06f394.png" },
    { name: "Veil",     tag: "Silk",   text: "Sheer veils drifting across a bright field.",         img: "hf_20261010_122559_cd7d4ad6-1870-4c6b-be0c-ddc232ab3ee6.png" },
    { name: "Tidepool", tag: "Pour",   text: "Poured pigment pooling into tide cells.",             img: "hf_20261010_122558_8b00b3b3-3d63-4c7f-873a-0a12be5f851e.png" },
    { name: "Dahlia",   tag: "Bloom",  text: "Petals unfurling in hot pink and gold.",              img: "hf_20261010_122559_6a2a462a-7e33-4479-94fd-b346f9052c14.png" },
    { name: "Delta",    tag: "Marble", text: "Rivers of colour braiding through stone.",            img: "hf_20261010_122616_b30d2d58-4c9d-4d18-835a-0b25a3b1b288.png" },
    { name: "Origami",  tag: "Fold",   text: "Creased planes catching the light.",                  img: "hf_20261010_122558_39f77472-4183-4631-b1e7-88db55e8af6a.png" },
    { name: "Nectar",   tag: "Liquid", text: "Molten colour swirling like warm glass.",             img: "hf_20261010_122558_a2adfe19-bf7c-4403-b512-44fd3e8a241c.png" },
    { name: "Kindling", tag: "Spark",  text: "Sparks scattered into a glowing tunnel.",             img: "hf_20261010_122559_a54ecbea-cbb1-4d33-b453-1ace42ff14c4.png" }
  ];
  var N = CARDS.length;

  /* Card pose by distance from the active slot (d = index - progress).
     d > 0: waiting in the stack behind · d = 0: presented · d < 0: folding over the crest and dropping.
     [d, centreY (fraction of deck height), scale, rotateX deg, opacity] */
  var POSE = [
    [-1.45, 1.200, 1.20, 89,  0],
    [-1.00, 1.060, 1.18, 86,  1],
    [-0.70, 0.905, 1.10, 35,  1],
    [-0.50, 0.787, 1.08,  8,  1],
    [-0.25, 0.680, 1.04, -2,  1],
    [ 0.00, 0.569, 1.00, -6,  1],
    [ 0.30, 0.469, 0.925,-16, 1],
    [ 0.50, 0.430, 0.90, -16, 1],
    [ 1.30, 0.338, 0.82, -16, 1],
    [ 2.30, 0.284, 0.77, -16, 1],
    [ 3.30, 0.246, 0.74, -16, 1],
    [ 4.30, 0.224, 0.72, -16, .5],
    [ 5.00, 0.214, 0.71, -16, 0]
  ];

  function pose(d) {
    var first = POSE[0], last = POSE[POSE.length - 1];
    if (d <= first[0]) return first;
    if (d >= last[0]) return last;
    for (var i = 1; i < POSE.length; i++) {
      if (d <= POSE[i][0]) {
        var a = POSE[i - 1], b = POSE[i], t = (d - a[0]) / (b[0] - a[0]);
        return [d, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t, a[4] + (b[4] - a[4]) * t];
      }
    }
    return last;
  }

  var section = document.getElementById("freefall");
  var deck = document.getElementById("deck");
  var numEl = document.getElementById("num");
  var nameEl = document.getElementById("name");
  var lineEl = document.getElementById("line");
  var fillEl = document.getElementById("fill");
  var dotEl = document.getElementById("dot");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  var els = CARDS.map(function (c, i) {
    var el = document.createElement("article");
    el.className = "card";
    el.style.zIndex = String(N - i);
    el.innerHTML =
      '<img src="' + CDN + c.img + '" alt="' + c.name + ' — ' + c.text + '" decoding="async"' + (i < 5 ? ' loading="eager"' : '') + '>' +
      '<span class="idx">' + pad(i + 1) + ' / ' + N + '</span>' +
      '<span class="tag">' + c.tag + '</span>' +
      '<div class="meta"><span class="chapter">Chapter ' + pad(i + 1) + '</span><h3>' + c.name + '</h3><p>' + c.text + '</p></div>';
    deck.appendChild(el);
    return el;
  });

  for (var k = 0; k < N; k++) {
    var mark = document.createElement("span");
    mark.className = "tick";
    mark.style.top = (k / (N - 1) * 100) + "%";
    lineEl.insertBefore(mark, fillEl);
  }

  var deckH = 0, lineH = 0, target = 0, current = 0, active = -1, raf = 0;

  function measure() {
    deckH = deck.clientHeight;
    lineH = lineEl.clientHeight;
    var cw = Math.min(320, deckH * 0.374, deck.clientWidth * 0.62);
    deck.style.setProperty("--cw", cw.toFixed(1) + "px");
  }

  function readScroll() {
    var range = section.offsetHeight - window.innerHeight;
    var y = -section.getBoundingClientRect().top;
    target = range > 0 ? Math.min(1, Math.max(0, y / range)) * (N - 1) : 0;
  }

  function render() {
    for (var i = 0; i < N; i++) {
      var p = pose(i - current), el = els[i];
      if (p[4] <= 0.001) { el.style.visibility = "hidden"; continue; }
      el.style.visibility = "visible";
      el.style.opacity = p[4].toFixed(3);
      el.style.transform = "translate3d(0," + (p[1] * deckH).toFixed(2) + "px,0) rotateX(" + p[3].toFixed(2) + "deg) scale(" + p[2].toFixed(4) + ")";
    }
    var f = current / (N - 1);
    fillEl.style.transform = "scaleY(" + f.toFixed(4) + ")";
    dotEl.style.transform = "translate3d(0," + (f * lineH).toFixed(2) + "px,0)";
    var a = Math.min(N - 1, Math.max(0, Math.round(current)));
    if (a !== active) {
      active = a;
      numEl.textContent = pad(a + 1);
      nameEl.textContent = CARDS[a].name;
    }
  }

  function tick() {
    var diff = target - current;
    if (reduce || Math.abs(diff) < 0.0005) {
      current = target;
      render();
      raf = 0;
      return;
    }
    current += diff * 0.14;
    render();
    raf = requestAnimationFrame(tick);
  }

  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  window.addEventListener("scroll", function () { readScroll(); kick(); }, { passive: true });
  window.addEventListener("resize", function () { measure(); readScroll(); current = target; render(); });

  document.getElementById("explore").addEventListener("click", function () {
    var range = section.offsetHeight - window.innerHeight;
    var next = Math.min(N - 1, Math.round(target) + 1);
    var top = section.getBoundingClientRect().top + window.scrollY + range * next / (N - 1);
    window.scrollTo({ top: top, behavior: reduce ? "auto" : "smooth" });
  });

  measure();
  readScroll();
  current = target;
  render();
})();
</script>
</body>
</html>
